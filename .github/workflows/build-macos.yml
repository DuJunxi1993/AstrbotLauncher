name: Build macOS

on:
  push:
    branches: [macos]
    tags: ['macos-v*']
  pull_request:
    branches: [macos]
  workflow_dispatch:

# NOTE: As of mid-2026, GitHub's macos-15 runner ships with the macOS 15 SDK,
# which does NOT contain the SwiftUI `glassEffect` / `glassProminent` APIs
# (introduced in the macOS 26 SDK). The macOS app relies on these APIs and
# therefore cannot be built on the available CI runners.
#
# This workflow is kept as a placeholder so that when GitHub ships a
# macos-26 runner, we can simply bump `runs-on` below and CI will start working.
#
# Until then, the build step is marked `continue-on-error` so CI status remains
# informational and does not block merges.

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version

      - name: Install Swift toolchain
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.2'

      - name: Build
        run: bash build.sh

      - name: Verify bundle
        run: |
          test -d AstrbotLauncher.app
          test -x AstrbotLauncher.app/Contents/MacOS/AstrbotLauncher
          du -sh AstrbotLauncher.app

      - name: Zip app bundle
        if: success()
        run: |
          cd AstrbotLauncher.app
          zip -r ../AstrbotLauncher-macOS.zip .

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AstrbotLauncher-macOS
          path: AstrbotLauncher-macOS.zip
          if-no-files-found: error

      - name: Create Release
        if: success() && startsWith(github.ref, 'refs/tags/macos-v')
        uses: softprops/action-gh-release@v2
        with:
          files: AstrbotLauncher-macOS.zip
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}