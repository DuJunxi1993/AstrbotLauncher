name: Build macOS

on:
  push:
    branches: [macos]
    tags: ['macos-v*']
  pull_request:
    branches: [macos]
  workflow_dispatch:

permissions:
  contents: write   # required for softprops/action-gh-release to create a release

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version

      - name: Install Swift toolchain
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.3'

      - name: Build
        run: bash build.sh

      - name: Verify bundle
        run: |
          test -d AstrbotLauncher.app
          test -x AstrbotLauncher.app/Contents/MacOS/AstrbotLauncher
          du -sh AstrbotLauncher.app

      - name: Zip app bundle
        run: |
          cd AstrbotLauncher.app
          zip -r ../AstrbotLauncher-macOS.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstrbotLauncher-macOS
          path: AstrbotLauncher-macOS.zip
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/macos-v')
        uses: softprops/action-gh-release@v2
        with:
          files: AstrbotLauncher-macOS.zip
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
