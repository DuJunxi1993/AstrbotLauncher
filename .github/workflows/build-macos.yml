name: Build macOS

on:
  push:
    branches: [macos]
    tags: ['macos-v*']
  pull_request:
    branches: [macos]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swift --version
          xcode-select -p

      - name: Build
        run: bash build.sh

      - name: Verify bundle
        run: |
          test -d AstrbotLauncher.app
          test -x AstrbotLauncher.app/Contents/MacOS/AstrbotLauncher
          du -sh AstrbotLauncher.app

      - name: Zip app bundle
        run: |
          cd AstrbotLauncher.app
          zip -r ../AstrbotLauncher-macOS.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstrbotLauncher-macOS
          path: AstrbotLauncher-macOS.zip
          if-no-files-found: error
