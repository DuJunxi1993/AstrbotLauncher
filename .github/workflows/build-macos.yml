name: Build macOS

on:
  push:
    branches: [macos]
    tags: ['macos-v*']
  pull_request:
    branches: [macos]
  workflow_dispatch:

permissions:
  contents: write   # required for softprops/action-gh-release to create a release

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version

      - name: Install Swift 6.2 toolchain
        run: |
          if ! xcrun swift --version 2>/dev/null | grep -q "6.2"; then
            echo "Installing Swift 6.2 toolchain..."
            curl -fsSL "https://download.swift.org/swift-6.2-release/xcode/swift-6.2-RELEASE/swift-6.2-RELEASE-osx.pkg" -o /tmp/swift-6.2.pkg
            sudo installer -pkg /tmp/swift-6.2.pkg -target /
            TOOLCHAIN=$(ls -d /Library/Developer/Toolchains/swift-6.2-RELEASE.xctoolchain 2>/dev/null || true)
            if [ -n "$TOOLCHAIN" ]; then
              sudo xcode-select --switch "$TOOLCHAIN"
            fi
          fi
          swift --version

      - name: Build
        run: bash build.sh

      - name: Verify bundle
        run: |
          test -d AstrbotLauncher.app
          test -x AstrbotLauncher.app/Contents/MacOS/AstrbotLauncher
          du -sh AstrbotLauncher.app

      - name: Zip app bundle
        run: |
          cd AstrbotLauncher.app
          zip -r ../AstrbotLauncher-macOS.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstrbotLauncher-macOS
          path: AstrbotLauncher-macOS.zip
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/macos-v')
        uses: softprops/action-gh-release@v2
        with:
          files: AstrbotLauncher-macOS.zip
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
